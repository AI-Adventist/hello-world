<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness Adventure</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/gsplat@latest/dist/gsplat.js"></script>
</head>
<body>
    <div id="threejs-container"></div>
    <div class="container">
        <video id="webcamFeed"></video>
        <canvas id="poseCanvas"></canvas>
    </div>

    <div id="ui-controls">
        <button id="toggleCameraButton">Start Camera</button>
        <button id="togglePoseButton">Toggle 3D Pose</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
